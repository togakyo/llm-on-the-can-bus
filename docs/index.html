<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM on the CAN bus — an AI writes the control program, safely</title>
  <meta name="description" content="An LLM writes a fresh CAN control program from your intent. A trusted safety supervisor inspects every frame before it reaches the bus — try to make it do something dangerous." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◉</span>
      <div>
        <h1>LLM on the CAN bus</h1>
        <p data-i18n="brand.tagline"></p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="pipeline-legend">
        <span data-i18n="pipe.1"></span><span class="arrow">→</span>
        <span data-i18n="pipe.2"></span><span class="arrow">→</span>
        <span data-i18n="pipe.3"></span><span class="arrow">→</span>
        <span data-i18n="pipe.4"></span><span class="arrow">→</span>
        <span data-i18n="pipe.5"></span>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日本語</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 左: コックピット可視化 -->
    <section class="stage-panel panel">
      <div class="stage-head">
        <h2 data-i18n="stage.title"></h2>
        <div class="stage-head-right">
          <div id="view-switch" class="view-switch" role="group" aria-label="View" hidden>
            <button type="button" data-view="2d">2D</button><button type="button" data-view="3d">3D</button>
          </div>
          <div id="vehicle-badge" class="badge badge-park"></div>
        </div>
      </div>

      <div class="stage">
        <svg id="cabin" viewBox="0 0 900 600" role="img" aria-label="車内コックピット">
          <defs>
            <radialGradient id="cabinBg" cx="50%" cy="38%" r="75%">
              <stop offset="0%" stop-color="#161a24" />
              <stop offset="100%" stop-color="#080a0f" />
            </radialGradient>
            <linearGradient id="dashGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#20242e" />
              <stop offset="100%" stop-color="#0d0f15" />
            </linearGradient>
          </defs>

          <rect x="0" y="0" width="900" height="600" fill="url(#cabinBg)" />

          <!-- windshield -->
          <path d="M170 40 L730 40 L680 210 L220 210 Z" fill="#0b1220" opacity="0.9" />
          <path d="M170 40 L730 40 L680 210 L220 210 Z" fill="none" stroke="#2a3550" stroke-width="2" />
          <text x="450" y="130" text-anchor="middle" class="ws-text">WINDSHIELD</text>

          <!-- dashboard structure -->
          <path d="M150 215 L750 215 L790 320 L110 320 Z" fill="url(#dashGrad)" stroke="#242a38" stroke-width="2" />

          <!-- === LIT ZONE: dashboard ambient strip === -->
          <rect id="z-dashboard" data-zone="dashboard" class="lit"
                x="205" y="232" width="490" height="10" rx="5" />

          <!-- instrument cluster -->
          <rect x="300" y="250" width="140" height="48" rx="8" fill="#05070c" stroke="#243049" />
          <rect x="452" y="250" width="150" height="48" rx="8" fill="#05070c" stroke="#243049" />
          <text x="370" y="279" text-anchor="middle" class="cluster-text">CLUSTER</text>
          <text x="527" y="279" text-anchor="middle" class="cluster-text">HUD</text>

          <!-- steering wheel -->
          <g transform="translate(360 400)">
            <circle r="72" fill="#0c0f16" stroke="#2a3346" stroke-width="10" />
            <circle r="26" fill="#12161f" stroke="#2a3346" stroke-width="6" />
            <rect x="-70" y="-8" width="44" height="16" rx="6" fill="#12161f" />
            <rect x="26" y="-8" width="44" height="16" rx="6" fill="#12161f" />
            <rect x="-8" y="26" width="16" height="46" rx="6" fill="#12161f" />
          </g>

          <!-- center console structure -->
          <path d="M545 320 L640 320 L680 585 L560 585 Z" fill="#0e121b" stroke="#232b3b" stroke-width="2" />
          <!-- === LIT ZONE: center console === -->
          <rect id="z-console" data-zone="console" class="lit"
                x="595" y="340" width="12" height="210" rx="6" />
          <rect x="565" y="360" width="90" height="54" rx="8" fill="#05070c" stroke="#243049" />
          <text x="610" y="392" text-anchor="middle" class="cluster-text">MEDIA</text>

          <!-- === LIT ZONE: cupholders === -->
          <ellipse class="lit" data-zone="cupholder" cx="600" cy="470" rx="22" ry="12" />
          <ellipse class="lit" data-zone="cupholder" cx="600" cy="510" rx="22" ry="12" />

          <!-- LEFT DOOR -->
          <path d="M110 320 L150 215 L150 585 L60 585 L60 360 Z" fill="#0d1119" stroke="#222a39" stroke-width="2" />
          <!-- === LIT ZONE: door_fl === -->
          <path id="z-door_fl" data-zone="door_fl" class="lit lit-stroke"
                d="M96 350 C 120 430, 120 500, 100 575" fill="none" stroke-width="7" stroke-linecap="round" />

          <!-- RIGHT DOOR -->
          <path d="M790 320 L750 215 L750 585 L840 585 L840 360 Z" fill="#0d1119" stroke="#222a39" stroke-width="2" />
          <!-- === LIT ZONE: door_fr === -->
          <path id="z-door_fr" data-zone="door_fr" class="lit lit-stroke"
                d="M804 350 C 780 430, 780 500, 800 575" fill="none" stroke-width="7" stroke-linecap="round" />

          <!-- === LIT ZONE: footwells === -->
          <ellipse id="z-footwell_fl" data-zone="footwell_fl" class="lit" cx="235" cy="560" rx="95" ry="30" />
          <ellipse id="z-footwell_fr" data-zone="footwell_fr" class="lit" cx="470" cy="575" rx="95" ry="28" />

          <text x="235" y="565" text-anchor="middle" class="zone-cap" data-i18n="zone.footL"></text>
          <text x="470" y="580" text-anchor="middle" class="zone-cap" data-i18n="zone.footR"></text>
        </svg>

        <canvas id="cabin3d" hidden></canvas>
        <div id="cam-presets" class="cam-presets" hidden>
          <button type="button" data-cam="overview" data-i18n="cam.overview"></button><button type="button" data-cam="driver" data-i18n="cam.driver"></button>
          <span class="cam-hint" data-i18n="view.hint3d"></span>
        </div>

        <!-- zone status chips -->
        <div id="zone-chips" class="zone-chips"></div>
      </div>

      <div class="stage-controls">
        <label class="drive-toggle">
          <span data-i18n="stage.vehicle"></span>
          <input type="range" id="speed" min="0" max="120" value="0" step="5" />
          <output id="speed-out">0 km/h（停車 · P）</output>
        </label>
        <button id="estop" class="estop" data-i18n="stage.estop"></button>
      </div>
    </section>

    <!-- 右: 操作 & パイプライン -->
    <section class="control-col">
      <div class="panel intent-panel">
        <h2 data-i18n="intent.title"></h2>
        <textarea id="intent" rows="2" data-i18n-ph="intent.ph"></textarea>
        <div class="mode-select">
          <span class="mode-label" data-i18n="intent.planner"></span>
          <label><input type="radio" name="mode" value="heuristic" checked /> <span data-i18n="intent.rule"></span></label>
          <label><input type="radio" name="mode" value="llm" /> <span data-i18n="intent.llm"></span></label>
        </div>
        <div id="mode-note" class="mode-note"></div>
        <div class="preset-group">
          <span class="preset-head" data-i18n="preset.safe"></span>
          <div id="presets-safe" class="presets"></div>
        </div>
        <div class="preset-group preset-attack">
          <span class="preset-head" data-i18n="preset.attack"></span>
          <div id="presets-attack" class="presets"></div>
        </div>
        <button id="generate" class="primary" data-i18n="intent.go"></button>
      </div>

      <div class="panel code-panel">
        <h2><span data-i18n="dsl.title"></span> <small data-i18n="dsl.note"></small></h2>
        <div id="dsl-source" class="dsl-source"></div>
        <pre id="dsl-out" class="code"><span class="muted" data-i18n="dsl.empty"></span></pre>
        <h3 data-i18n="dsl.frames"></h3>
        <pre id="frames-out" class="code small"><span class="muted">—</span></pre>
      </div>

      <div class="panel safety-panel">
        <h2><span data-i18n="safety.title"></span> <small id="safety-summary"></small></h2>
        <ul id="safety-list" class="safety-list"><li class="muted" data-i18n="safety.empty"></li></ul>
      </div>

      <div class="panel bus-panel">
        <h2><span data-i18n="bus.title"></span> <small id="bus-count"></small></h2>
        <div id="bus-monitor" class="bus-monitor"></div>
      </div>

      <div class="panel audit-panel">
        <h2><span data-i18n="rta.title"></span> <small data-i18n="rta.note"></small></h2>
        <div id="rta-status" class="rta-status rta-nominal" data-i18n="rta.nominal"></div>
        <div id="audit-log" class="audit-log"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n-html="foot.text"></span>
    <a href="https://github.com/togakyo/llm-on-the-can-bus" target="_blank" rel="noopener" data-i18n="foot.link"></a>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
