[package]
name = "planner-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AIプランナーのRustバックエンド（意図→照明DSL）。フロントの /plan・/health をドロップイン置換"

[[bin]]
name = "planner-server"
path = "src/main.rs"

[dependencies]
# ベース（常に必要・高速コンパイル）
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 実LLM推論（--features llm のときだけ）: Qwen2.5-0.5B を candle でネイティブ実行
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.20", optional = true }
hf-hub = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }

[features]
default = []
# 実モデルを有効化: cargo run --release --features llm
llm = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:anyhow"]
# Apple Silicon (Metal) / NVIDIA (CUDA) アクセラレータ（llm を含む）
metal = ["llm", "candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["llm", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[profile.release]
opt-level = 3
